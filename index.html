<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>AR Multiple Barcode Markers</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.loaders.min.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
}
</style>

</head>

<body>

<a-scene
embedded
vr-mode-ui="enabled:false"
renderer="logarithmicDepthBuffer:true"
arjs="
sourceType:webcam;
debugUIEnabled:false;
detectionMode:mono_and_matrix;
matrixCodeType:3x3;
">

<a-assets>

<a-asset-item
id="animated-asset"
src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb">
</a-asset-item>

</a-assets>

<!-- Barcode Marker 7 -->
<a-marker
type="barcode"
value="7">

<a-box
position="0 0.5 0"
color="yellow">
</a-box>

</a-marker>

<!-- Barcode Marker 6 -->
<a-marker
id="animated-marker"
type="barcode"
value="6">

<a-entity
gltf-model="#animated-asset"
position="0 0 0"
rotation="0 0 0"
scale="1.5 1.5 1.5">
</a-entity>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

</body>
</html>
