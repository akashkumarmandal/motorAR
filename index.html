<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Android AR Barcode Scanner</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

  <!-- GLTF/GLB loader -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.loaders.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #2196F3;
      color: white;
    }
  </style>
</head>

<body>

  <button id="startButton">START AR CAMERA</button>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
      logarithmicDepthBuffer: true;
    "

    arjs="
      sourceType: webcam;
      facingMode: environment;
      debugUIEnabled: false;
      detectionMode: mono_and_matrix;
      matrixCodeType: 3x3;
    "
  >

    <a-assets>

      <a-asset-item
        id="animatedAsset"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb">
      </a-asset-item>

    </a-assets>


    <!-- ========================= -->
    <!-- BARCODE 7 -->
    <!-- ========================= -->

    <a-marker
      type="barcode"
      value="7"
      emitevents="true">

      <a-box
        position="0 0.5 0"
        width="1"
        height="1"
        depth="1"
        color="yellow">

      </a-box>

    </a-marker>


    <!-- ========================= -->
    <!-- BARCODE 6 -->
    <!-- ========================= -->

    <a-marker
      id="animatedMarker"
      type="barcode"
      value="6"
      emitevents="true">

      <a-entity
        gltf-model="#animatedAsset"
        animation-mixer
        position="0 0 0"
        rotation="0 0 0"
        scale="1.5 1.5 1.5">

      </a-entity>

    </a-marker>


    <!-- CAMERA -->

    <a-entity camera></a-entity>

  </a-scene>


  <script>

    /*
     * Android WebView:
     * Request camera access after user interaction.
     */

    const startButton = document.getElementById("startButton");

    startButton.addEventListener("click", async function () {

      try {

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

          alert(
            "Camera is not available in this WebView."
          );

          return;
        }

        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

        startButton.style.display = "none";

      } catch (error) {

        console.error(error);

        alert(
          "Camera permission was denied or the camera cannot be accessed."
        );

      }

    });

  </script>

</body>
</html>
