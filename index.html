<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>AR.js - Akash</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

</head>

<body style="margin:0; overflow:hidden;">

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="
        sourceType: webcam;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3;
        debugUIEnabled: true;
    ">

    <!-- Barcode 7 -->
    <a-marker
        type="barcode"
        value="7">

        <!-- Plane -->
        <a-plane
            position="0 0.8 0"
            rotation="-90 0 0"
            width="2"
            height="1"
            color="white">

            <!-- Text -->
            <a-text
                value="Akash"
                align="center"
                color="blue"
                width="4"
                position="0 0 0.01">
            </a-text>

        </a-plane>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
