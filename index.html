<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>AR Motor Monitor</title>


<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- AR.js -->
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

<!-- Animation Support -->
<script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.loaders.min.js"></script>


<style>

body{
    margin:0;
    overflow:hidden;
}

</style>


</head>


<body>


<a-scene

embedded

vr-mode-ui="enabled:false"

renderer="logarithmicDepthBuffer:true"

arjs="
sourceType:webcam;
debugUIEnabled:false;
detectionMode:mono_and_matrix;
matrixCodeType:3x3;
">


<a-assets>

<a-asset-item

id="motorModel"

src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb">

</a-asset-item>

</a-assets>



<!-- ================= MARKER 6 MOTOR ================= -->


<a-marker

id="marker6"

type="barcode"

value="6">


<!-- 3D Motor Model -->


<a-entity

gltf-model="#motorModel"

position="0 0.1 0"

rotation="0 180 0"

scale="1.5 1.5 1.5"

animation-mixer>

</a-entity>



<!-- Information Background -->


<a-plane

position="0 2.2 0"

rotation="-90 0 0"

width="3"

height="1.8"

color="black"

opacity="0.65">

</a-plane>



<!-- Status -->

<a-text

id="statusText"

value="Status : STOP"

position="-1.2 2.8 0.02"

rotation="-90 0 0"

color="lime"

scale="0.8 0.8 0.8">

</a-text>



<!-- R Phase -->


<a-text

id="rText"

value="R : 0 V"

position="-1.2 2.45 0.02"

rotation="-90 0 0"

color="red"

scale="0.8 0.8 0.8">

</a-text>



<!-- Y Phase -->


<a-text

id="yText"

value="Y : 0 V"

position="-1.2 2.1 0.02"

rotation="-90 0 0"

color="yellow"

scale="0.8 0.8 0.8">

</a-text>



<!-- B Phase -->


<a-text

id="bText"

value="B : 0 V"

position="-1.2 1.75 0.02"

rotation="-90 0 0"

color="cyan"

scale="0.8 0.8 0.8">

</a-text>



</a-marker>





<!-- ================= MARKER 7 ================= -->


<a-marker

id="marker7"

type="barcode"

value="7">


<a-box

position="0 0.5 0"

color="yellow">

</a-box>



<a-text

value="Mukesh Sir"

position="-1 1.5 0"

rotation="-90 0 0"

align="center"

color="red"

scale="1 1 1">

</a-text>


</a-marker>





<a-entity camera></a-entity>


</a-scene>





<script>


// Send message to MIT App Inventor

function sendToAppInventor(message)

{

    console.log(message);


    if(window.AppInventor &&

       typeof window.AppInventor.setWebViewString === "function")

    {

        window.AppInventor.setWebViewString(message);

    }

}




// Update AR information panel


function updateMotorData(r,y,b,status)

{

    document.querySelector("#statusText")
    .setAttribute("value",
    "Status : "+status);


    document.querySelector("#rText")
    .setAttribute("value",
    "R : "+r+" V");


    document.querySelector("#yText")
    .setAttribute("value",
    "Y : "+y+" V");


    document.querySelector("#bText")
    .setAttribute("value",
    "B : "+b+" V");

}





// Default Data


updateMotorData(

415,

414,

416,

"RUNNING"

);





// Receive data from App Inventor


window.updateFromApp=function(data)

{

    let p=data.split(",");


    if(p.length>=4)

    {

        updateMotorData(

        p[0],

        p[1],

        p[2],

        p[3]

        );

    }

};







// Marker Detection


document.querySelector("a-scene")

.addEventListener("loaded",function(){



const marker6=document.querySelector("#marker6");

const marker7=document.querySelector("#marker7");




marker6.addEventListener(

"markerFound",

function(){

sendToAppInventor(
"Marker 6 Found"
);

});




marker6.addEventListener(

"markerLost",

function(){

sendToAppInventor(
"Marker 6 Lost"
);

});





marker7.addEventListener(

"markerFound",

function(){

sendToAppInventor(
"Marker 7 Found"
);

});





marker7.addEventListener(

"markerLost",

function(){

sendToAppInventor(
"Marker 7 Lost"
);

});



});



</script>



</body>

</html>
