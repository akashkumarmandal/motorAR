<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>AR.js Test</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js marker tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

</head>

<body style="margin:0; overflow:hidden;">

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="
        sourceType: webcam;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3;
        debugUIEnabled: true;
    ">

    <!-- Barcode 7 -->

    <a-marker
        type="barcode"
        value="7">

        <a-box
            position="0 0.5 0"
            color="red"
            scale="1 1 1">
        </a-box>

    </a-marker>


    <!-- Camera -->

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
