<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>AR.js Barcode Demo</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

    <!-- A-Frame Extras -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.loaders.min.js"></script>

    <style>
        body{
            margin:0;
            overflow:hidden;
        }
    </style>
</head>

<body>

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam;
          debugUIEnabled: false;
          detectionMode: mono_and_matrix;
          matrixCodeType: 3x3;">

    <a-assets>
        <a-asset-item
            id="animated-asset"
            src="https://raw.GithubUserContent.com/KhronosGroup/glTF-Sample-Assets/main/./Models/CesiumMan/glTF-Binary/CesiumMan.glb">
        </a-asset-item>
    </a-assets>

    <!-- Barcode Marker 7 -->
    <a-marker id="marker7"
              type="barcode"
              value="7">

        <a-box
            position="0 0.5 0"
            color="yellow">
        </a-box>

         <!-- Text -->
    <a-text
        value="Mukesh Sir"
        position="0 1.3 0"
        align="center"
        color="red"
        scale="1 1 1"
        rotation="-90 0 0">
    </a-text>

    </a-marker>

    <!-- Barcode Marker 6 -->
    <a-marker id="marker6"
              type="barcode"
              value="6">

        <a-entity
            gltf-model="#animated-asset"
            position="0 0 0"
            rotation="0 0 0"
            scale="2 2 2"
            animation-mixer>
        </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>

function sendToAppInventor(message){
    if(window.AppInventor &&
       typeof window.AppInventor.setWebViewString === "function"){
        window.AppInventor.setWebViewString(message);
    }
    console.log(message);
}

window.addEventListener("load", function(){

    const marker6=document.querySelector("#marker6");
    const marker7=document.querySelector("#marker7");

    marker6.addEventListener("markerFound",function(){
        sendToAppInventor("Marker 6 Found");
    });

    marker6.addEventListener("markerLost",function(){
        sendToAppInventor("Marker 6 Lost");
    });

    marker7.addEventListener("markerFound",function(){
        sendToAppInventor("Marker 7 Found");
    });

    marker7.addEventListener("markerLost",function(){
        sendToAppInventor("Marker 7 Lost");
    });

});

</script>

</body>
</html>
