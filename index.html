<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Motor AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>

<script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

</style>

</head>

<body>

<a-scene
    embedded
    vr-mode-ui="enabled: false"

    renderer="
        antialias: true;
        alpha: true;
        logarithmicDepthBuffer: true;
    "

    arjs="
        sourceType: webcam;
        debugUIEnabled: false;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3;
    "
>

<a-assets>

    <a-asset-item
        id="cesiumMan"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb">
    </a-asset-item>

</a-assets>


<!-- BARCODE 7 -->

<a-marker
    type="barcode"
    value="7">

    <a-box
        position="0 0.5 0"
        width="1"
        height="1"
        depth="1"
        color="yellow">
    </a-box>

</a-marker>


<!-- BARCODE 6 -->

<a-marker
    type="barcode"
    value="6">

    <a-entity
        gltf-model="#cesiumMan"
        animation-mixer
        position="0 0 0"
        rotation="0 0 0"
        scale="1.5 1.5 1.5">
    </a-entity>

</a-marker>


<a-entity camera></a-entity>

</a-scene>

</body>
</html>
