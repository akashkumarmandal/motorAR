<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Motor AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js Marker Tracking -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>

  <!-- GLTF / GLB loader -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

    }

    #loading {

      position: fixed;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #000;

      color: white;

      font-family: Arial, sans-serif;

      font-size: 20px;

      z-index: 9999;

    }

  </style>

</head>


<body>


  <!-- Loading screen -->

  <div id="loading">

    Starting AR Camera...

  </div>


  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="

      antialias: true;

      alpha: true;

      logarithmicDepthBuffer: true;

    "

    arjs="

      sourceType: webcam;

      facingMode: environment;

      debugUIEnabled: false;

      detectionMode: mono_and_matrix;

      matrixCodeType: 3x3;

    "

  >


    <!-- ========================== -->
    <!-- ASSETS -->
    <!-- ========================== -->

    <a-assets>

      <a-asset-item

        id="cesiumMan"

        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb">

      </a-asset-item>

    </a-assets>



    <!-- ========================== -->
    <!-- BARCODE 7 -->
    <!-- ========================== -->

    <a-marker

      id="marker7"

      type="barcode"

      value="7"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >

      <a-box

        position="0 0.5 0"

        width="1"

        height="1"

        depth="1"

        color="#FFD600"

      >

      </a-box>

    </a-marker>



    <!-- ========================== -->
    <!-- BARCODE 6 -->
    <!-- ========================== -->

    <a-marker

      id="marker6"

      type="barcode"

      value="6"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >

      <a-entity

        gltf-model="#cesiumMan"

        position="0 0 0"

        rotation="0 0 0"

        scale="1.5 1.5 1.5"

        animation-mixer

      >

      </a-entity>

    </a-marker>



    <!-- ========================== -->
    <!-- CAMERA -->
    <!-- ========================== -->

    <a-entity camera></a-entity>


  </a-scene>



  <script>

    window.addEventListener("load", function () {

      setTimeout(function () {

        var loading =
          document.getElementById("loading");

        if (loading) {

          loading.style.display = "none";

        }

      }, 3000);

    });


    /*
     * Detect AR.js camera initialization.
     */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        console.log(
          "Motor AR started"
        );

      }
    );


  </script>


</body>

</html>
