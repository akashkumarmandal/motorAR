<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             user-scalable=no">

  <title>Camera Test</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-family: Arial;
      z-index: 10;
    }
  </style>
</head>

<body>

<div id="status">
  Requesting camera...
</div>

<video id="camera" autoplay playsinline></video>

<script>

const video = document.getElementById("camera");
const status = document.getElementById("status");

async function startCamera() {

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      status.innerHTML =
        "ERROR: getUserMedia is not available";

      return;
    }

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });

    video.srcObject = stream;

    status.innerHTML = "CAMERA WORKING";

  }

  catch (error) {

    status.innerHTML =
      "CAMERA ERROR: " + error.name +
      "<br>" + error.message;

    console.error(error);

  }

}

startCamera();

</script>

</body>
</html>
